apiVersion: apps/v1
kind: Deployment
metadata:
  name: fossbilling-api
  labels:
    app: fossbilling
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fossbilling
      component: api
  template:
    metadata:
      labels:
        app: fossbilling
        component: api
    spec:
      containers:
      - name: api
        image: fossbilling/backend-go:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: fossbilling-config
        - secretRef:
            name: fossbilling-secrets
        livenessProbe:
          httpGet:
            path: /api/v1/guest/system/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/guest/system/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fossbilling-api
spec:
  selector:
    app: fossbilling
    component: api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
