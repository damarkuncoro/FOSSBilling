version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: fossbilling-postgres-test
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: fossbilling_test
    ports:
      - "5433:5432"
    volumes:
      - ../backend-go/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d fossbilling_test"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - fossbilling-test-net

networks:
  fossbilling-test-net:
    driver: bridge
