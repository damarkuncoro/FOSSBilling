version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fossbilling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fossbilling
      POSTGRES_PASSWORD: secretpassword123
      POSTGRES_DB: fossbilling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend-go/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fossbilling -d fossbilling"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fossbilling-net

  redis:
    image: redis:7-alpine
    container_name: fossbilling-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - fossbilling-net

  api:
    build:
      context: ../backend-go
      dockerfile: Dockerfile
    container_name: fossbilling-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - DATABASE_URL=postgres://fossbilling:secretpassword123@postgres:5432/fossbilling?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production-ready-super-secret-jwt-key-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fossbilling-net

  worker:
    build:
      context: ../backend-go
      dockerfile: Dockerfile
    container_name: fossbilling-worker
    restart: unless-stopped
    command: ["/app/worker"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgres://fossbilling:secretpassword123@postgres:5432/fossbilling?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production-ready-super-secret-jwt-key-32-chars
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fossbilling-net

  admin-portal:
    build:
      context: ../frontend-administrator
      dockerfile: Dockerfile
    container_name: fossbilling-admin-portal
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - fossbilling-net

  client-portal:
    build:
      context: ../frontend-client
      dockerfile: Dockerfile
    container_name: fossbilling-client-portal
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - fossbilling-net

networks:
  fossbilling-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
