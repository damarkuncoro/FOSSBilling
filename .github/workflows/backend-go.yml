name: Go Backend CI & Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'backend-go/**'
      - 'tests-backend-go/**'
      - '.github/workflows/backend-go.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend-go/**'
      - 'tests-backend-go/**'
      - '.github/workflows/backend-go.yml'

jobs:
  test:
    name: Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: |
          backend-go/go.sum
          tests-backend-go/go.sum

    - name: Start PostgreSQL for Integration Tests
      run: |
        docker run --name postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=fossbilling -p 5432:5432 -d postgres:16-alpine
        # Wait for postgres to be ready
        until docker exec postgres pg_isready; do
          sleep 1
        done

    - name: Run Test Suite
      working-directory: tests-backend-go
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/fossbilling?sslmode=disable
      run: |
        go test -v ./...

    - name: Build Binaries (API, Worker, CLI & Demo)
      working-directory: backend-go
      run: |
        CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/api ./cmd/api
        CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/worker ./cmd/worker
        CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/cli ./cmd/cli
        CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/demo ./cmd/demo
