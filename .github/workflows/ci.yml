name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build
        run: cd backend-go && go build -v ./...
      - name: Test
        run: cd backend-go && go test -v ./...

  frontend-admin:
    name: Frontend (Admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd frontend-administrator && npm install
      - name: Lint
        run: cd frontend-administrator && npm run lint
      - name: Build
        run: cd frontend-administrator && npm run build

  frontend-client:
    name: Frontend (Client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd frontend-client && npm install
      - name: Lint
        run: cd frontend-client && npm run lint
      - name: Build
        run: cd frontend-client && npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gosec (Go Security Scan)
        uses: securego/gosec@master
        with:
          args: ./backend-go/...
